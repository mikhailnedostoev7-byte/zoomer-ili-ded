<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZOOMER TEST</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;min-height:100vh;display:grid;place-items:center;background:radial-gradient(at 15% 10%,#30204d,transparent 35%),radial-gradient(at 90% 85%,#123849,transparent 35%),#090914;color:#f7f5ff;font:16px system-ui}.wrap{width:min(100%,560px)}.logo{text-align:center;font-size:clamp(36px,10vw,62px);font-weight:1000;letter-spacing:-2px}.logo span{color:#47e8ff}.sub{text-align:center;color:#aaa9c5;margin:8px 0 22px}.panel{background:#15152aee;border:1px solid #ffffff20;border-radius:24px;padding:22px;box-shadow:0 20px 70px #0008}.hidden{display:none!important}button{width:100%;padding:15px;border:0;border-radius:14px;margin:8px 0;font-size:17px;font-weight:850;background:linear-gradient(100deg,#ff3ca6,#ff8ad0);color:#090914}button.answer{background:#252541;color:#fff;text-align:left;border:1px solid #ffffff18}button.good{background:#164336!important;border-color:#55efad!important}button.bad{background:#4a1e36!important;border-color:#ff5c82!important}.stats{display:flex;justify-content:space-between;color:#aaa9c5;font-size:13px}.barbg{height:7px;background:#292941;border-radius:8px;margin:16px 0 20px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ff3ca6,#47e8ff);width:0}.tag{font-size:12px;color:#47e8ff;font-weight:900;letter-spacing:1.4px}.q{font-size:clamp(22px,6vw,30px);line-height:1.18;margin:10px 0 16px;font-weight:850}.hint{text-align:center;color:#aaa9c5;font-size:13px;margin-top:14px}.result{text-align:center}.score{font-size:56px;font-weight:1000;color:#47e8ff}.small{color:#aaa9c5;font-size:14px}</style>
<body><main class="wrap"><div class="logo">ZOOMER <span>TEST</span></div><div class="sub">100 вопросов. Насколько ты в теме? ⚡</div>
<section class="panel" id="home"><div style="text-align:center;font-size:48px">🧠⚡</div><h2 style="text-align:center">10 уровней. Финал — хардкор.</h2><p class="small" style="text-align:center">Сленг, мемы и интернет-культура. За правильный ответ +10 очков.</p><button onclick="start()">ПОГНАЛИ 🚀</button><div class="hint">Полная версия • 100 вопросов</div></section>
<section class="panel hidden" id="game"><div class="stats"><span id="lv"></span><span id="num"></span><span id="pts"></span></div><div class="barbg"><div class="bar" id="progress"></div></div><div class="tag" id="tag"></div><h2 class="q" id="question"></h2><div id="opts"></div><div class="hint" id="feedback">Выбери ответ</div><button class="hidden" id="next" onclick="advance()">ДАЛЬШЕ →</button></section>
<section class="panel hidden result" id="result"><div style="font-size:48px">🏆</div><h2>Тест пройден!</h2><div class="score" id="score"></div><h3 id="rank"></h3><p class="small" id="detail"></p><button onclick="again()">ЕЩЁ РАЗ 🔁</button></section></main>
<script>
let data,idx=0,points=0,locked=false;
fetch('questions.json').then(r=>r.json()).then(d=>data=d.questions);
function start(){if(!data){alert('Вопросы загружаются, попробуй ещё раз');return}idx=0;points=0;home.classList.add('hidden');result.classList.add('hidden');game.classList.remove('hidden');draw()}
function draw(){locked=false;let q=data[idx],l=Math.floor(idx/10)+1;lv.textContent='Уровень '+l+'/10';num.textContent='Вопрос '+(idx%10+1)+'/10';pts.textContent=points+' очков';progress.style.width=(idx+1)+'%';tag.textContent=l<=2?'РАЗМИНКА':l<=5?'УЖЕ СЛОЖНЕЕ':l<=8?'ХАРД':'ФИНАЛЬНЫЙ БОСС';question.textContent=q[0];feedback.textContent='Выбери ответ';next.classList.add('hidden');opts.innerHTML='';let a=q.slice(1,5).map((v,i)=>({v,i})).sort(()=>Math.random()-.5);a.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o.v;b.onclick=()=>answer(b,o.i);opts.appendChild(b)})}
function answer(btn,n){if(locked)return;locked=true;let q=data[idx];document.querySelectorAll('.answer').forEach(b=>b.disabled=true);if(n===q[5]){btn.classList.add('good');points+=10;feedback.textContent='ИМБА! +10 очков 🔥'}else{btn.classList.add('bad');feedback.textContent='Мимо 😭 Правильно: '+q[q[5]+1];document.querySelectorAll('.answer').forEach(b=>{if(b.textContent===q[q[5]+1])b.classList.add('good')})}pts.textContent=points+' очков';next.classList.remove('hidden')}
function advance(){idx++;if(idx===100){finish();return}draw()}
function finish(){game.classList.add('hidden');result.classList.remove('hidden');score.textContent=points+'/1000';rank.textContent=points>=850?'ЗУМЕР-БОГ 👑':points>=650?'В ТЕМЕ 😎':points>=400?'НОРМ, НО ЕСТЬ ПРОБЕЛЫ 🫡':'БРАТ, ТЕБЕ В ИНТЕРНЕТ НАДО';detail.textContent='Правильных ответов: '+points/10+' из 100.'}
function again(){result.classList.add('hidden');home.classList.remove('hidden')}
</script></body></html>
